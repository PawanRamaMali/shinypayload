# Configuration for pkgdown
url: https://pawanramamali.github.io/shinypayload/

template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    primary: "#0073e6"
    secondary: "#6c757d"
  
favicon: man/figures/logo.png

development:
  mode: auto

home:
  title: "shinypayload • Accept POST Data in Shiny"
  description: >
    Accept POSTed JSON/form data and URL query params in Shiny applications.
    Handle POST requests on the same port as your Shiny UI with reactive data integration.

navbar:
  title: "shinypayload"
  structure:
    left:  [intro, reference, news]
    right: [search, github]

logo:
  src: man/figures/logo.png
  components:
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/PawanRamaMali/shinypayload
      aria-label: GitHub

reference:
- title: "Core Functions"
  desc: "Main functions for handling POST data in Shiny"
  contents:
  - payload_ui
  - payload_last
  - params_get
  - payload_endpoint_url
  - setup_payload_endpoint

- title: "Request Methods"
  desc: "Functions for handling different HTTP methods and request patterns"
  contents:
  - payload_methods
  - payload_stream
  - payload_conditional
  - payload_batch

- title: "History Management"
  desc: "Functions for managing request history"
  contents:
  - payload_history
  - payload_history_config
  - payload_history_clear
  - payload_history_stats

- title: "Security Configuration"
  desc: "Functions for managing security settings"
  contents:
  - payload_security_config
  - payload_security_status
  - payload_security_clear_rate_limits

- title: "Data Management"
  desc: "Functions for managing payload data"
  contents:
  - payload_data_config
  - payload_data_status
  - payload_data_clear

- title: "CORS Configuration"
  desc: "Cross-Origin Resource Sharing (CORS) settings"
  contents:
  - payload_cors_config
  - payload_cors_status

- title: "Health Check"
  desc: "Built-in health check endpoint for container orchestration"
  contents:
  - payload_health_config
  - payload_health_status

- title: "Custom Responses"
  desc: "Configure custom response handlers for endpoints"
  contents:
  - payload_response_config
  - payload_response_status

- title: "Schema Validation"
  desc: "JSON Schema validation for incoming payloads"
  contents:
  - payload_schema_config
  - payload_schema_status

- title: "Async Queue Processing"
  desc: "Deferred payload processing with retry and dead letter queue"
  contents:
  - payload_queue_config
  - payload_queue
  - payload_queue_process
  - payload_queue_status
  - payload_queue_clear
  - payload_queue_dead_letter

- title: "Upload Configuration"
  desc: "Multipart form and file upload settings"
  contents:
  - payload_upload_config
  - payload_upload_status

- title: "Debugging and Logging"
  desc: "Functions for debugging and logging"
  contents:
  - payload_debug_config
  - payload_debug_status
  - payload_logs
  - payload_logs_clear

- title: "System Status"
  desc: "Functions for monitoring system status"
  contents:
  - payload_system_status

news:
  releases:
  - text: "Development version"
    href: https://github.com/PawanRamaMali/shinypayload/blob/main/NEWS.md
  - text: "Version 0.1.0"
    href: https://github.com/PawanRamaMali/shinypayload/releases/tag/v0.1.0

footer:
  structure:
    left: [built_with, package]
    right: [github, issues]
  components:
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/PawanRamaMali/shinypayload
      aria-label: GitHub
    issues:
      text: "Report issues"
      href: https://github.com/PawanRamaMali/shinypayload/issues
